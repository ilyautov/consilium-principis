name: Windows smoke

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Windows Python 3.12 smoke
    runs-on: windows-latest
    env:
      CONSILIUM_NO_PAUSE: "1"
      HEPHAESTUS_ENGINE: C:\\nonexistent\\hephaestus
      OLLAMA_HOST: http://127.0.0.1:59999
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements/ci-no-numpy.txt
      - name: Run installer and stdio tests offline
        run: python -m pytest tests/test_mcp_install.py tests/test_install.py tests/test_mcp_server_stdio.py -q
      - name: Exercise generation publication through the NTFS junction fallback
        run: python -m pytest tests/test_generation_publication.py::test_windows_junction_fallback_publishes_two_generations_and_retrieves -q
      - name: Smoke-test the Windows launcher
        shell: cmd
        run: install.bat --print
