name: tests

# Защищает главный инвариант: SIMPLE-тир (гейт верности + сборка корпуса) работает БЕЗ ollama и
# БЕЗ внешнего движка Гефеста — то есть у любого, кто просто склонировал репо. Семантика (FULL)
# здесь намеренно недоступна: тесты должны это переживать (graceful fallback), а не падать.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      HEPHAESTUS_ENGINE: /nonexistent      # внешний движок отсутствует (как у внешнего юзера)
      OLLAMA_HOST: http://127.0.0.1:59999  # ollama недоступен → лексический пол
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: python -m pip install --require-hashes -r requirements/ci.txt
      - name: Firewall guard (секреты / запрещённые к трекингу файлы)
        # В CI приватного advisors/ нет (gitignored), поэтому гард в основном проверяет
        # паттерны секретов и «никогда-не-трекать» файлов — это всё равно ценно (ловит
        # утёкший ключ / .env / приватный якорь в трекаемых файлах ДО прогона тестов).
        run: sh scripts/firewall_check.sh
      - name: Repository and skill consistency
        run: python -m pytest tests/test_plugin_manifests.py -q
      - name: Compile tracked Python scripts
        run: git ls-files '*.py' | xargs -r python -m py_compile
      - name: Run tests (SIMPLE-тир, без ollama/движка)
        run: python -m pytest tests/ -q

  pytest-no-numpy:
    # H8: заявлено «ядро — чистый stdlib». Эта нога ставит ТОЛЬКО pytest (без numpy) и гоняет
    # тот же офлайн-инвариант: numpy-зависимые тесты (tier_full-транзитив) обязаны SKIPнуться
    # через pytest.importorskip, а НЕ уронить сбор ImportError'ом. Зелёный тут = ядро реально stdlib.
    runs-on: ubuntu-latest
    env:
      HEPHAESTUS_ENGINE: /nonexistent
      OLLAMA_HOST: http://127.0.0.1:59999
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install deps (pytest ТОЛЬКО, без numpy)
        run: python -m pip install --require-hashes -r requirements/ci-no-numpy.txt
      - name: Run tests (ожидаем SKIP numpy-тестов, НЕ collection-error)
        run: python -m pytest tests/ -q

  pytest-macos:
    # macOS-нога: тот же офлайн-инвариант на Python 3.12 (кросс-платформенность ядра —
    # пути от __file__, детач ollama, сокет-песочница conftest работают и на darwin).
    # TODO windows-latest leg — held pending green verification
    runs-on: macos-latest
    env:
      HEPHAESTUS_ENGINE: /nonexistent
      OLLAMA_HOST: http://127.0.0.1:59999
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install deps
        run: python -m pip install --require-hashes -r requirements/ci.txt
      - name: Run tests (SIMPLE-тир, без ollama/движка)
        run: python -m pytest tests/ -q
