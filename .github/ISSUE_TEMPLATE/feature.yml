name: Feature request
description: Propose a problem to solve and a testable outcome.
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has this problem, and what currently fails for them?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the smallest useful change and how it could be verified.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
