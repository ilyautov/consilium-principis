name: Windows smoke

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Windows Python 3.12 smoke
    runs-on: windows-latest
    env:
      CONSILIUM_NO_PAUSE: "1"
      OLLAMA_HOST: http://127.0.0.1:59999
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install hash-locked test dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements/ci.txt
      - name: Run installer, stdio and subscription-backend tests offline
        run: python -m pytest tests/test_mcp_install.py tests/test_install.py tests/test_mcp_server_stdio.py tests/test_cli_backends.py tests/test_sub_worker.py tests/test_host_install.py -q
      - name: Exercise generation publication through the NTFS junction fallback
        run: python -m pytest tests/test_generation_publication.py::test_windows_junction_fallback_publishes_two_generations_and_retrieves -q
      - name: Smoke-test the Windows launcher
        shell: cmd
        run: install.bat --print
