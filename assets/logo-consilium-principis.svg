<svg width="420" height="470" viewBox="0 0 420 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Consilium Principis emblem">
  <title>Consilium Principis</title>
  <desc>Печать-медальон: принцепс в центре, кольцо советников вокруг (много перспектив, одно решение), лавровая ветвь, вордмарк.</desc>
  <defs>
    <style>
      .ink{stroke:#232826;fill:none;}
      .inkf{fill:#232826;}
      .gold{stroke:#b5894e;fill:none;}
      .goldf{fill:#b5894e;}
      .word{fill:#232826;font-family:Georgia,'Times New Roman',serif;}
      .tag{fill:#6f6a62;font-family:Georgia,serif;}
    </style>
  </defs>

  <!-- medallion rings -->
  <circle cx="210" cy="175" r="128" class="ink" stroke-width="2"/>
  <circle cx="210" cy="175" r="118" class="gold" stroke-width="1"/>

  <!-- council graph: connectors center -> advisors -->
  <g class="ink" stroke-width="1.4">
    <line x1="210" y1="175" x2="210" y2="113"/>
    <line x1="210" y1="175" x2="264" y2="144"/>
    <line x1="210" y1="175" x2="264" y2="206"/>
    <line x1="210" y1="175" x2="210" y2="237"/>
    <line x1="210" y1="175" x2="156" y2="206"/>
    <line x1="210" y1="175" x2="156" y2="144"/>
  </g>

  <!-- advisor nodes -->
  <g>
    <circle cx="210" cy="113" r="8" class="ink" stroke-width="1.8" fill="#faf7f1"/>
    <circle cx="264" cy="144" r="8" class="ink" stroke-width="1.8" fill="#faf7f1"/>
    <circle cx="264" cy="206" r="8" class="ink" stroke-width="1.8" fill="#faf7f1"/>
    <circle cx="210" cy="237" r="8" class="ink" stroke-width="1.8" fill="#faf7f1"/>
    <circle cx="156" cy="206" r="8" class="ink" stroke-width="1.8" fill="#faf7f1"/>
    <circle cx="156" cy="144" r="8" class="ink" stroke-width="1.8" fill="#faf7f1"/>
  </g>

  <!-- princeps (center) -->
  <circle cx="210" cy="175" r="13" class="goldf"/>
  <circle cx="210" cy="175" r="13" class="ink" stroke-width="1.5"/>
  <circle cx="210" cy="175" r="4.5" fill="#faf7f1"/>

  <!-- laurel sprigs (bottom, inside ring) -->
  <g class="goldf">
    <path d="M205,268 q-26,-4 -40,-20" class="gold" stroke-width="1.6"/>
    <ellipse cx="196" cy="266" rx="6" ry="2.6" transform="rotate(24 196 266)"/>
    <ellipse cx="184" cy="262" rx="6" ry="2.6" transform="rotate(30 184 262)"/>
    <ellipse cx="173" cy="255" rx="6" ry="2.6" transform="rotate(40 173 255)"/>
    <path d="M215,268 q26,-4 40,-20" class="gold" stroke-width="1.6"/>
    <ellipse cx="224" cy="266" rx="6" ry="2.6" transform="rotate(-24 224 266)"/>
    <ellipse cx="236" cy="262" rx="6" ry="2.6" transform="rotate(-30 236 262)"/>
    <ellipse cx="247" cy="255" rx="6" ry="2.6" transform="rotate(-40 247 255)"/>
  </g>

  <!-- wordmark -->
  <text x="210" y="358" text-anchor="middle" class="word" font-size="33" letter-spacing="3">CONSILIVM</text>
  <text x="210" y="392" text-anchor="middle" class="word" font-size="33" letter-spacing="6">PRINCIPIS</text>
  <line x1="120" y1="412" x2="300" y2="412" class="gold" stroke-width="1"/>
  <text x="210" y="432" text-anchor="middle" class="tag" font-size="11.5" letter-spacing="4">СОВЕТ ПЕРСПЕКТИВ ДЛЯ ОДНОГО РЕШЕНИЯ</text>
</svg>
